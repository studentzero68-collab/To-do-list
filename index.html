<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do-list</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
     <link rel="stylesheet" href="main.css">
    
</head>
<body>
    <main>
        
        <div class="app">

            <header>
                <h1>My To-do list</h1>
                <button id="create">Add new todo</button>
            </header>

            <div class="filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="incomplete">Incomplete</button>
                <button class="filter-btn" data-filter="inprogress">In Progress</button>
                <button class="filter-btn" data-filter="complete">Complete</button>
            </div>

            <div class="todo-list" id="list">

                
                

            </div>

        </div>


    </main>
    <script src="main.js"></script>
</body>
</html>
